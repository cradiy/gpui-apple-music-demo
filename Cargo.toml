[package]
name = "gpui-apple-music-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "An Apple Music-inspired demo built to show off a GPUI fork"

[dependencies]
anyhow = "1"
async-channel = "2.5"
dirs = "6"
flexi_logger = { version = "0.31", features = ["colors"] }

# gpui = { git = "https://github.com/cradiy/gpui.git", rev = "5fd13e4b6d984c95b1de2fdd6213a8fde0ab89ea" }
# gpui_effects = { git = "https://github.com/cradiy/gpui.git", rev = "5fd13e4b6d984c95b1de2fdd6213a8fde0ab89ea" }
# gpui_media = { git = "https://github.com/cradiy/gpui.git", rev = "5fd13e4b6d984c95b1de2fdd6213a8fde0ab89ea", default-features = false, features = [
#   "audio",
# ] }
# gpui_platform = { git = "https://github.com/cradiy/gpui.git", rev = "5fd13e4b6d984c95b1de2fdd6213a8fde0ab89ea", features = [
#   "font-kit",
#   "wayland",
# ] }
# gpui_tokio = { git = "https://github.com/cradiy/gpui.git", rev = "5fd13e4b6d984c95b1de2fdd6213a8fde0ab89ea" }
# uic = { git = "https://github.com/cradiy/gpui.git", rev = "5fd13e4b6d984c95b1de2fdd6213a8fde0ab89ea" }

gpui = { path = "../gpui/crates/gpui" }
gpui_effects = { path = "../gpui/crates/gpui_effects" }
gpui_media = { path = "../gpui/crates/gpui_media", default-features = false, features = [
  "audio",
] }
gpui_platform = { path = "../gpui/crates/gpui_platform", features = [
  "font-kit",
  "wayland",
] }
gpui_tokio = { path = "../gpui/crates/gpui_tokio" }
uic = { path = "../gpui/uic" }

log = "0.4"
symphonia = { version = "0.6.0", default-features = false, features = [
  "all-codecs",
  "all-meta",
  "all-formats",
] }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "sync"] }
toml = "1.1"
uuid = { version = "1.24.0", features = ["v4"] }
zbus = "5.18"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
] }
