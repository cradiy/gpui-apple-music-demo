[package]
name = "gpui-apple-music-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "An Apple Music-inspired demo built to show off a GPUI fork"

[dependencies]
async-channel = "2.5"
gpui = { git = "https://github.com/cradiy/gpui.git", rev = "18856bd9bb370a4f6cc58452705d24479b7c96b9" }
gpui_effects = { git = "https://github.com/cradiy/gpui.git", rev = "18856bd9bb370a4f6cc58452705d24479b7c96b9" }
gpui_media = { git = "https://github.com/cradiy/gpui.git", rev = "18856bd9bb370a4f6cc58452705d24479b7c96b9", default-features = false, features = ["audio"] }
gpui_platform = { git = "https://github.com/cradiy/gpui.git", rev = "18856bd9bb370a4f6cc58452705d24479b7c96b9", features = [
  "font-kit",
  "wayland",
  "x11",
] }
uic = { git = "https://github.com/cradiy/gpui.git", rev = "18856bd9bb370a4f6cc58452705d24479b7c96b9" }
zbus = "5.18"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
] }
