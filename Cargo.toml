[package]
name = "gpui-apple-music-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "An Apple Music-inspired demo built to show off a GPUI fork"

[workspace]
members = ["apps/android"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
async-channel = "2.5"
dirs = "7"
flexi_logger = { version = "0.31", features = ["colors"] }

gpui = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b586e94ae933dc1fd19901258b3dfd43de047bf3" }
gpui_effects = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b586e94ae933dc1fd19901258b3dfd43de047bf3" }
gpui_icons = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b586e94ae933dc1fd19901258b3dfd43de047bf3", features = [
  "lucide-editing",
  "lucide-files",
  "lucide-media",
  "lucide-misc",
] }
gpui_tokio = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b586e94ae933dc1fd19901258b3dfd43de047bf3" }
uic = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b586e94ae933dc1fd19901258b3dfd43de047bf3" }
gpui_media = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b586e94ae933dc1fd19901258b3dfd43de047bf3", default-features = false, features = [
  "audio",
] }
gpui_platform = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b586e94ae933dc1fd19901258b3dfd43de047bf3" }

log = "0.4"
symphonia = { version = "0.6.0", default-features = false, features = [
  "all-codecs",
  "all-meta",
  "all-formats",
] }
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "sync"] }
toml = "1.1"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
] }

[profile.dev.package]
cosmic-text = { opt-level = 3 }
harfrust = { opt-level = 3 }
skrifa = { opt-level = 3 }
read-fonts = { opt-level = 3 }
font-types = { opt-level = 3 }
swash = { opt-level = 3 }
fontdb = { opt-level = 3 }
unicode-bidi = { opt-level = 3 }
unicode-linebreak = { opt-level = 3 }
unicode-segmentation = { opt-level = 3 }
rangemap = { opt-level = 3 }
smol_str = { opt-level = 3 }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[target.'cfg(target_os = "android")'.dependencies]
gpui_media = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b586e94ae933dc1fd19901258b3dfd43de047bf3", default-features = false, features = ["video"] }
gpui_media_backend = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b586e94ae933dc1fd19901258b3dfd43de047bf3", default-features = false }
