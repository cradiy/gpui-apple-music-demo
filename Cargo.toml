[package]
name = "gpui-apple-music-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "An Apple Music-inspired demo built to show off a GPUI fork"

[dependencies]
anyhow = "1"
async-channel = "2.5"
dirs = "7"
flexi_logger = { version = "0.31", features = ["colors"] }

gpui = { git = "https://github.com/cradiy/gpui.git", rev = "ed7aed3e16c58bd78735451c6a72918795a2d1ea" }
gpui_effects = { git = "https://github.com/cradiy/gpui.git", rev = "ed7aed3e16c58bd78735451c6a72918795a2d1ea" }
gpui_tokio = { git = "https://github.com/cradiy/gpui.git", rev = "ed7aed3e16c58bd78735451c6a72918795a2d1ea" }
uic = { git = "https://github.com/cradiy/gpui.git", rev = "ed7aed3e16c58bd78735451c6a72918795a2d1ea" }
gpui_media = { git = "https://github.com/cradiy/gpui.git", rev = "ed7aed3e16c58bd78735451c6a72918795a2d1ea", default-features = false, features = [
  "audio",
] }
gpui_platform = { git = "https://github.com/cradiy/gpui.git", rev = "ed7aed3e16c58bd78735451c6a72918795a2d1ea", features = [
  "font-kit",
  "wayland",
] }

log = "0.4"
symphonia = { version = "0.6.0", default-features = false, features = [
  "all-codecs",
  "all-meta",
  "all-formats",
] }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "sync"] }
toml = "1.1"
uuid = { version = "1.24.0", features = ["v4"] }
zbus = "5.19"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
] }
